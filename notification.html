<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notifications — IFRI_MentorLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f4f6f9;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: #1a2942;
      min-height: 100vh;
      padding: 1.5rem 1rem;
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.05rem;
      font-weight: 700;
      color: white;
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2.5rem;
      text-decoration: none;
    }

    .contenu {
      margin-left: 250px;
      padding: 2rem;
      width: 100%;
      max-width: 900px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: #1a2942;
      margin-bottom: 1.5rem;
    }

    .lien {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.92rem;
      font-weight: 500;
      padding: 0.7rem 1rem;
      border-radius: 8px;
      text-decoration: none;
      margin-bottom: 0.2rem;
      transition: all 0.2s;
    }

    .lien:hover {
      background: rgba(255, 255, 255, 0.08);
      color: white;
    }

    .lien.actif {
      background: #2563eb;
      color: white;
    }

    .btn-suppr {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 1rem;
      cursor: pointer;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .btn-suppr:hover {
      color: #ef4444;
      background: #fef2f2;
    }
  </style>
</head>

<body>
  <aside class="sidebar">
    <div>
      <a href="accueil.html" class="logo">🎓 IFRI_MentorLink</a>
      <a href="#" class="lien">🏠 Tableau de bord</a>
      <a href="profil.html" class="lien">👤 Mon profil</a>
      <a href="#" class="lien">📋 Offres de mentorat</a>
      <a href="#" class="lien">📝 Demandes de mentorat</a>
      <a href="messagerie.html" class="lien">💬 Messagerie</a>
      <a href="notification.html" class="lien actif">🔔 Notifications</a>
      <a href="parametre.html" class="lien">⚙️ Paramètres</a>
    </div>
    <a href="deconnexion.html" class="lien-rouge lien">→ Déconnexion</a>
  </aside>
  <main class="contenu">
    <h1>Notifications</h1>
    <div class="notif-item non-lu">
      <div class="notif-avatar"></div>
      <div class="notif-body">
        <div class="notif-nom"></div>
        <div class="notif-msg"></div>
      </div>
      <div class="notif-time"></div>
    </div>
    <button onclick="supprimer(this)" class="btn-suppr"></button>
    <div class="notif-item non-lu">
      <div class="notif-avatar systeme"></div>
      <div class="notif-body">
        <div class="notif-nom"></div>
        <div class="notif-msg">
        </div>
      </div>
      <div class="notif-time"></div>
    </div>
    <button onclick="supprimer(this)" class="btn-suppr"></button>
    <div class="notif-item non-lu">
      <div class="notif-avatar"></div>
      <div class="notif-body">
        <div class="notif-nom"></div>
        <div class="notif-msg">
        </div>
      </div>
      <div class="notif-time"></div>
    </div>
    <div class="notif-item">
      <div lass="notif-avatar"></div>
      <button onclick="supprimer(this)" class="btn-suppr"></button>
      <div class="notif-body">
        <div class="notif-nom"></div>
        <div class="notif-msg">
        </div>
      </div>
      <div class="notif-time"></div>
    </div>
    <button onclick="supprimer(this)" class="btn-suppr"></button>
    <div class="bas">
      <button class="btn-marquer" onclick="toutMarquer()">
  </main>
  <script>
    function toutMarquer() {
      document.querySelectorAll('.notif-item.non-lu').forEach(el => {
        el.classList.remove('non-lu');
      });
      document.querySelector('.badge-notif').style.display = 'none';
    }
    function supprimer(btn) {
      btn.closest('.notif-item').remove();
    }
  </script>
</body>

</html>
