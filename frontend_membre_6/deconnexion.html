<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Déconnexion - IFRI_MentorLink</title>
    <style>
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(5px); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-box {
            background-color: #ffffff;
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            text-align: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .modal-title {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #111111;
            margin-bottom: 20px;
        }
        .modal-icon {
            margin: 20px auto;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-text {
            font-size: 16px;
            color: #333333;
            line-height: 1.5;
            margin-bottom: 30px;
            padding: 0 10px;
        }
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
        }
        .btn {
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-block;
        }
        .btn-cancel {
            background-color: #ffffff;
            color: #111111;
            border: 2px solid #111111;
        }
        .btn-cancel:hover {
            background-color: #f0f0f0;
        }
        .btn-logout {
            background-color: #0066cc;
            color: #ffffff;
            border: none;
        }
        .btn-logout:hover {
            background-color: #0052a3;
        }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="modal-box">
            <h2 class="modal-title">Déconnexion</h2>
            <div class="modal-icon">
                <svg viewBox="0 0 24 24" width="60" height="60" fill="none" stroke="#001f3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4" />
                    <polyline points="16 17 21 12 16 7" />
                    <line x1="21" y1="12" x2="9" y2="12" />
                </svg>
            </div>
            <p class="modal-text">
                Vous êtes sur le point de vous déconnecter de votre compte <strong>IFRI_MentorLink</strong>. Êtes-vous sûr ?
            </p>
            <div class="modal-buttons">
                <a href="profil.html" class="btn btn-cancel">Annuler</a>
                <a href="Acceuil.html" class="btn btn-logout">Me déconnecter</a>
            </div>
        </div>
    </div>
</body>
</html>
