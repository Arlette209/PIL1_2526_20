<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Connexion — IFRI_MentorLink</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
     body {
      font-family: 'DM Sans', sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
     .wrapper {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 2rem;
      width: 100%;
      max-width: 820px;
    }
     .card {
      background: white;
      border-radius: 12px;
      padding: 2.5rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.07);
    }
    .logo {
      font-size: 1.1rem;
      font-weight: 700;
      color: #1a2942;
      display: block;
      margin-bottom: 2rem;
    }
     h2 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #1a2942;
      margin-bottom: 0.3rem;
    }
     .sous-titre {
      color: #6b7280;
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
     label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 0.4rem;
    }
     input {
      width: 100%;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      padding: 0.75rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.92rem;
      color: #1a2942;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 1rem;
    }
     input:focus { border-color: #2563eb; }
    input.invalide { border-color: #ef4444; }
    .champ-pwd { position: relative; }
    .champ-pwd input { padding-right: 3rem; margin-bottom: 0; }
    .voir-pwd {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      cursor: pointer;
      color: #9ca3af;
    }
     .lien-oubli {
      display: block;
      text-align: right;
      font-size: 0.82rem;
      color: #2563eb;
      text-decoration: none;
      margin-top: 0.4rem;
      margin-bottom: 1.5rem;
    }
     .erreur {
      font-size: 0.78rem;
      color: #ef4444;
      display: none;
      margin-top: 0.2rem;
      margin-bottom: 0.6rem;
    }
    .erreur.visible { display: block; }
    .btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.85rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 1rem;
    }
    .btn:hover { background: #1d4ed8; }
    .separateur {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: #9ca3af;
      font-size: 0.82rem;
      margin-bottom: 1rem;
    }
    .separateur::before,
    .separateur::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #e5e7eb;
    }
    .btn-google {
      width: 100%;
      background: white;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      padding: 0.75rem;
      font-family: 'DM Sans', sans-serif;
      font-weight: 500;
      font-size: 0.92rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      color: #374151;
      margin-bottom: 1.5rem;
    }
     .bas {
      text-align: center;
      font-size: 0.88rem;
      color: #6b7280;
    }
    .bas a {
      color: #2563eb;
      font-weight: 600;
      text-decoration: none;
    }
      .carte-securite {
      background: #eff6ff;
      border-radius: 12px;
      padding: 2rem;
      text-align: center;
    }
    .carte-securite .icone { font-size: 3rem; margin-bottom: 1rem; }
    .carte-securite h3 {
      font-size: 1rem;
      font-weight: 700;
      color: #1a2942;
      margin-bottom: 1rem;
    }
    .carte-securite ul { list-style: none; text-align: left; }
    .carte-securite ul li {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      color: #374151;
      margin-bottom: 0.6rem;
    }
    .ok { color: #16a34a; font-weight: 700; }

    @media (max-width: 640px) {
      .wrapper { grid-template-columns: 1fr; }
      .carte-securite { display: none; }
    }
  </style>
</head>
<body>
<div class="wrapper">
 <div class="card">
    <span class="logo">🎓 IFRI_MentorLink</span>
    <h2>Connexion</h2>
    <p class="sous-titre">Bienvenue de retour !</p>
   <label>Email ou numéro de téléphone</label>
    <input type="text" id="identifiant"
           placeholder="Entrez votre email ou téléphone"/>
    <span class="erreur" id="err-id">Ce champ est requis.</span>
     <label>Mot de passe</label>
    <div class="champ-pwd">
      <input type="password" id="password"
             placeholder="Entrez votre mot de passe"/>
      <button class="voir-pwd" onclick="togglePwd()">👁</button>
    </div>
    <span class="erreur" id="err-pwd">Le mot de passe est requis.</span>
    <a href="#" class="lien-oubli">Mot de passe oublié ?</a>
     <button class="btn" onclick="connecter()">Se connecter</button>

    <div class="separateur">ou</div>
   <button class="btn-google">
      <span>G</span> Continuer avec Google
    </button>
   <div class="bas">
      Pas encore de compte ?
      <a href="inscription.html">S'inscrire</a>
    </div>
  </div>

  <div class="carte-securite">
    <div class="icone">🔒</div>
    <h3>Connexion sécurisée</h3>
    <ul>
      <li><span class="ok">✓</span> Chiffrement des données</li>
      <li><span class="ok">✓</span> Connexion sécurisée (HTTPS)</li>
      <li><span class="ok">✓</span> Confidentialité garantie</li>
    </ul>
  </div>
</div>
<script>
  function togglePwd() {
    const champ = document.getElementById('password');
    const btn   = document.querySelector('.voir-pwd');
    if (champ.type === 'password') {
      champ.type = 'text';
      btn.textContent = '🙈';
    } else {
      champ.type = 'password';
      btn.textContent = '👁';
    }
  }
   function connecter() {
    const id  = document.getElementById('identifiant').value.trim();
    const pwd = document.getElementById('password').value;
    let ok = true;
    if (!id) {
      document.getElementById('err-id').classList.add('visible');
      document.getElementById('identifiant').classList.add('invalide');
      ok = false;
    } else {
      document.getElementById('err-id').classList.remove('visible');
      document.getElementById('identifiant').classList.remove('invalide');
    }
    if (!pwd) {
      document.getElementById('err-pwd').classList.add('visible');
      document.getElementById('password').classList.add('invalide');
      ok = false;
    } else {
      document.getElementById('err-pwd').classList.remove('visible');
      document.getElementById('password').classList.remove('invalide');
    }
    if (ok) {
      window.location.href = 'profil.html';
    }
  }
</script>

</body>
</html>
